services:
  - type: web
    name: wing-commander
    runtime: python
    plan: free
    # najpierw paczki pythona, potem budowanie Reacta (Flask podaje pliki z frontend/dist)
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 22.12.0
      # http jest przekierowane na https, a przeglądarka dostaje nagłówek HSTS
      - key: FORCE_HTTPS
        value: "1"
